name: Gate 90 CI

on:
  push:
    branches:
      - research/joint-epistemic-control-gate90
  workflow_dispatch:

jobs:
  gate90:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
      - name: Build and audit Gate 90 joint epistemic control
        run: |
          lake build PEL4.JointEpistemicControl
          lake env lean PEL4/JointEpistemicControlAxiomAudit.lean
