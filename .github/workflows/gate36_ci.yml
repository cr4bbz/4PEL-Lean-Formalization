name: Gate 36 CI

on:
  push:
    branches:
      - research/semantic-feedback-boundary-gate36
  workflow_dispatch:

jobs:
  gate36:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
      - name: Build and audit Gate 36 semantic feedback boundary
        run: |
          lake build PEL4.SemanticFeedbackBoundary
          lake env lean PEL4/SemanticFeedbackBoundaryAxiomAudit.lean
