name: Gate 74 CI

on:
  push:
    branches:
      - research/posterior-sample-complexity-gate74
  workflow_dispatch:

jobs:
  gate74:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
      - name: Build and audit Gate 74 posterior sample complexity
        run: |
          lake build PEL4.PosteriorSampleComplexity
          lake env lean PEL4/PosteriorSampleComplexityAxiomAudit.lean
