name: Gate 61 CI

on:
  push:
    branches:
      - research/bayesian-filter-sufficiency-gate61
  workflow_dispatch:

jobs:
  gate61:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
      - name: Build and audit Gate 61 Bayesian filter sufficiency
        run: |
          lake build PEL4.BayesianFilterSufficiency
          lake env lean PEL4/BayesianFilterSufficiencyAxiomAudit.lean
