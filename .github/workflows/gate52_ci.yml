name: Gate 52 CI

on:
  push:
    branches:
      - research/epistemic-regret-gate52
  pull_request:
  workflow_dispatch:

jobs:
  gate52:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
      - name: Build and audit Gate 52 epistemic regret
        run: |
          lake build PEL4.EpistemicRegret
          lake env lean PEL4/EpistemicRegretAxiomAudit.lean
