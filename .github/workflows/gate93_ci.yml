name: Gate 93 CI

on:
  push:
    branches:
      - research/meta-epistemic-dual-control-gate93
  workflow_dispatch:

jobs:
  gate93:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
      - name: Build and audit Gate 93 meta-epistemic dual control
        run: |
          lake build PEL4.MetaEpistemicDualControl
          lake env lean PEL4/MetaEpistemicDualControlAxiomAudit.lean
