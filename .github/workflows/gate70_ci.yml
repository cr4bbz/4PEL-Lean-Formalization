name: Gate 70 CI

on:
  push:
    branches:
      - research/parametric-sensing-cost-phase-gate70
  workflow_dispatch:

jobs:
  gate70:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
      - name: Build and audit Gate 70 parametric sensing-cost phase
        run: |
          lake build PEL4.ParametricSensingCostPhase
          lake env lean PEL4/ParametricSensingCostPhaseAxiomAudit.lean
