name: Gate 89 CI

on:
  push:
    branches:
      - research/repeated-model-learning-gate89
  workflow_dispatch:

jobs:
  gate89:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
      - name: Build and audit Gate 89 repeated model learning
        run: |
          lake build PEL4.RepeatedModelLearning
          lake env lean PEL4/RepeatedModelLearningAxiomAudit.lean
