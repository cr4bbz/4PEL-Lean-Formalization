name: Gate 89 CI

on:
  push:
    branches:
      - research/joint-world-model-belief-gate89
  workflow_dispatch:

jobs:
  gate89:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
      - name: Build and audit Gate 89 joint world-model belief
        run: |
          lake build PEL4.JointWorldModelBelief
          lake env lean PEL4/JointWorldModelBeliefAxiomAudit.lean
