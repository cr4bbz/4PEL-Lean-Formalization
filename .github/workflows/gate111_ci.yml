name: Gate 111 CI

on:
  push:
    branches:
      - research/active-identification-repair-gate111
  workflow_dispatch:

jobs:
  gate111:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
      - name: Build and audit Gate 111 active identification repair
        run: |
          lake build PEL4.ActiveIdentificationRepair
          lake env lean PEL4/ActiveIdentificationRepairAxiomAudit.lean
