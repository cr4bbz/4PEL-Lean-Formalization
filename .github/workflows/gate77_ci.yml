name: Gate 77 CI

on:
  push:
    branches:
      - research/active-contradiction-resolution-gate77
  workflow_dispatch:

jobs:
  gate77:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
      - name: Build and audit Gate 77 active contradiction resolution
        run: |
          lake build PEL4.ActiveContradictionResolution
          lake env lean PEL4/ActiveContradictionResolutionAxiomAudit.lean
