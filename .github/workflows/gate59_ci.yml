name: Gate 59 CI

on:
  push:
    branches:
      - research/canonical-epistemic-beliefs-gate59
  workflow_dispatch:

jobs:
  gate59:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
      - name: Build and audit Gate 59 canonical epistemic beliefs
        run: |
          lake build PEL4.CanonicalEpistemicBeliefs
          lake env lean PEL4/CanonicalEpistemicBeliefsAxiomAudit.lean
