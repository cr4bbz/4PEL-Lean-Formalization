name: Gate 60 CI

on:
  push:
    branches:
      - research/noisy-epistemic-observation-gate60
  workflow_dispatch:

jobs:
  gate60:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
      - name: Build and audit Gate 60 noisy epistemic observation
        run: |
          lake build PEL4.NoisyEpistemicObservation
          lake env lean PEL4/NoisyEpistemicObservationAxiomAudit.lean
