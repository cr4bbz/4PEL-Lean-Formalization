name: Gate 98 CI

on:
  push:
    branches:
      - research/model-misspecification-gate98
  workflow_dispatch:

jobs:
  gate98:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
      - name: Build and audit Gate 98 model misspecification
        run: |
          lake build PEL4.ModelMisspecification
          lake env lean PEL4/ModelMisspecificationAxiomAudit.lean
