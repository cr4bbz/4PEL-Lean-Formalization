name: Gate 44 CI

on:
  push:
    branches:
      - research/markov-bridge-gate44
  workflow_dispatch:

jobs:
  gate44:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
      - name: Build and audit Gate 44 Markov bridge
        run: |
          lake build PEL4.MarkovBridge
          lake env lean PEL4/MarkovBridgeAxiomAudit.lean
