name: Gate 96 CI

on:
  push:
    branches:
      - research/calibration-regret-gate96
  workflow_dispatch:

jobs:
  gate96:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
      - name: Build and audit Gate 96 calibration regret
        run: |
          lake build PEL4.CalibrationRegret
          lake env lean PEL4/CalibrationRegretAxiomAudit.lean
