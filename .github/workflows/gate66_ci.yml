name: Gate 66 CI

on:
  push:
    branches:
      - research/repeated-evidence-learning-gate66
  workflow_dispatch:

jobs:
  gate66:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
      - name: Build and audit Gate 66 repeated evidence learning
        run: |
          lake build PEL4.RepeatedEvidenceLearning
          lake env lean PEL4/RepeatedEvidenceLearningAxiomAudit.lean
