name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
      - name: Build and audit Gates 66-67 repeated learning and experiment design
        run: |
          lake build PEL4.RepeatedEvidenceLearning
          lake env lean PEL4/RepeatedEvidenceLearningAxiomAudit.lean
          lake build PEL4.AliasBreakingExperimentDesign
          lake env lean PEL4/AliasBreakingExperimentDesignAxiomAudit.lean
      - name: Build and audit Gates 62-65 belief decision and sensing
        run: |
          lake build PEL4.BeliefStateBellmanControl
          lake env lean PEL4/BeliefStateBellmanControlAxiomAudit.lean
          lake build PEL4.NoisyValueOfInformation
          lake env lean PEL4/NoisyValueOfInformationAxiomAudit.lean
          lake build PEL4.ActiveEpistemicSensing
          lake env lean PEL4/ActiveEpistemicSensingAxiomAudit.lean
          lake build PEL4.EpistemicIdentifiability
          lake env lean PEL4/EpistemicIdentifiabilityAxiomAudit.lean
      - name: Build and audit Gates 58-61 Bayesian filtering foundation
        run: |
          lake build PEL4.GenericBayesianNormalization
          lake env lean PEL4/GenericBayesianNormalizationAxiomAudit.lean
          lake build PEL4.CanonicalEpistemicBeliefs
          lake env lean PEL4/CanonicalEpistemicBeliefsAxiomAudit.lean
          lake build PEL4.NoisyEpistemicObservation
          lake env lean PEL4/NoisyEpistemicObservationAxiomAudit.lean
          lake build PEL4.BayesianFilterSufficiency
          lake env lean PEL4/BayesianFilterSufficiencyAxiomAudit.lean
      - name: Build and audit Gate 57 Bayesian belief-state MDP
        run: |
          lake build PEL4.BayesianBeliefStateMDP
          lake env lean PEL4/BayesianBeliefStateMDPAxiomAudit.lean
      - name: Build and audit Gate 56 finite epistemic POMDP
        run: |
          lake build PEL4.FiniteEpistemicPOMDP
          lake env lean PEL4/FiniteEpistemicPOMDPAxiomAudit.lean
      - name: Build and audit Gate 55 partial observation boundary
        run: |
          lake build PEL4.PartialObservationBoundary
          lake env lean PEL4/PartialObservationBoundaryAxiomAudit.lean
      - name: Build and audit Gate 54 truth calibration bridge
        run: |
          lake build PEL4.TruthCalibrationBridge
          lake env lean PEL4/TruthCalibrationBridgeAxiomAudit.lean
      - name: Build and audit Gates 49-53 epistemic decision theory
        run: |
          lake build PEL4.FiniteEpistemicDecisionProcess
          lake env lean PEL4/FiniteEpistemicDecisionProcessAxiomAudit.lean
          lake build PEL4.StochasticEpistemicDecisionProcess
          lake env lean PEL4/StochasticEpistemicDecisionProcessAxiomAudit.lean
          lake build PEL4.ValueOfInformation
          lake env lean PEL4/ValueOfInformationAxiomAudit.lean
          lake build PEL4.EpistemicRegret
          lake env lean PEL4/EpistemicRegretAxiomAudit.lean
          lake build PEL4.EpistemicRewardAlignment
          lake env lean PEL4/EpistemicRewardAlignmentAxiomAudit.lean
      - name: Build and audit Gate 48 exploration exploitation
        run: |
          lake build PEL4.EpistemicExplorationExploitation
          lake env lean PEL4/EpistemicExplorationExploitationAxiomAudit.lean
      - name: Build and audit Gate 47 rational destabilization
        run: |
          lake build PEL4.RationalDestabilization
          lake env lean PEL4/RationalDestabilizationAxiomAudit.lean
      - name: Build and audit Gate 46 reward misspecification
        run: |
          lake build PEL4.EpistemicRewardMisspecification
          lake env lean PEL4/EpistemicRewardMisspecificationAxiomAudit.lean
      - name: Build and audit Gate 45 active evidence control
        run: |
          lake build PEL4.ActiveEvidenceControl
          lake env lean PEL4/ActiveEvidenceControlAxiomAudit.lean
      - name: Build and audit Gate 44 Markov bridge
        run: |
          lake build PEL4.MarkovBridge
          lake env lean PEL4/MarkovBridgeAxiomAudit.lean
      - name: Build and audit Gate 43 discrete epistemic curvature
        run: |
          lake build PEL4.DiscreteEpistemicCurvature
          lake env lean PEL4/DiscreteEpistemicCurvatureAxiomAudit.lean
      - name: Build and audit Gate 42 epistemic hysteresis loops
        run: |
          lake build PEL4.EpistemicHysteresisLoops
          lake env lean PEL4/EpistemicHysteresisLoopsAxiomAudit.lean
      - name: Build and audit Gate 35 growing ontology / Product Update
        run: |
          lake build PEL4.GrowingOntologyProductUpdate
          lake env lean PEL4/GrowingOntologyProductUpdateAxiomAudit.lean
      - name: Build and audit Gate 41 Recovery under semantic feedback
        run: |
          lake build PEL4.RecoveryUnderSemanticFeedback
          lake env lean PEL4/RecoveryUnderSemanticFeedbackAxiomAudit.lean
      - name: Build and audit Gate 40 strong hysteresis boundary
        run: |
          lake build PEL4.StrongHysteresisBoundary
          lake env lean PEL4/StrongHysteresisBoundaryAxiomAudit.lean
      - name: Build and audit Gate 39 epistemic state sufficiency
        run: |
          lake build PEL4.EpistemicStateSufficiency
          lake env lean PEL4/EpistemicStateSufficiencyAxiomAudit.lean
      - name: Build and audit Gate 38 static schedule confluence
        run: |
          lake build PEL4.StaticScheduleConfluenceFinite
          lake env lean PEL4/StaticScheduleConfluenceAxiomAudit.lean
      - name: Build and audit Gate 36 semantic feedback boundary
        run: |
          lake build PEL4.SemanticFeedbackBoundary
          lake env lean PEL4/SemanticFeedbackBoundaryAxiomAudit.lean
      - name: Build and audit Gate 34 regenerative recovery budgets
        run: |
          lake build PEL4.RegenerativeRecoveryBudget
          lake env lean PEL4/RegenerativeRecoveryBudgetAxiomAudit.lean
      - name: Build and audit Gate 33 epistemic hysteresis
        run: |
          lake build PEL4.EpistemicHysteresis
          lake env lean PEL4/EpistemicHysteresisAxiomAudit.lean
      - name: Build and audit Gate 32 recovery epistemic attractor
        run: |
          lake build PEL4.RecoveryEpistemicAttractor
          lake env lean PEL4/RecoveryEpistemicAttractorAxiomAudit.lean
      - name: Build and audit Gate 31 progress and stabilization bounds
        run: |
          lake build PEL4.RecoveryStabilizationBounds
          lake env lean PEL4/RecoveryStabilizationBoundsAxiomAudit.lean
      - name: Build and audit Gate 30 recovery confluence
        run: |
          lake build PEL4.RecoveryConfluence
          lake env lean PEL4/RecoveryConfluenceAxiomAudit.lean
      - name: Build and audit Gate 29 epistemic path dependence
        run: |
          lake build PEL4.ConditionalizationAtomicIdempotence
          lake env lean PEL4/ConditionalizationAtomicIdempotenceAxiomAudit.lean
          lake build PEL4.EpistemicPathDependence
          lake env lean PEL4/EpistemicPathDependenceAxiomAudit.lean
          lake build PEL4.EpistemicPathDependenceAsymptotic
          lake env lean PEL4/EpistemicPathDependenceAsymptoticAxiomAudit.lean
      - name: Build and audit Gate 28 recovery endpoint classification
        run: |
          lake build PEL4.RecoveryEndpointClassification
          lake env lean PEL4/RecoveryEndpointClassificationAxiomAudit.lean
      - name: Build and audit Gate 27 eventual recovery stability
        run: |
          lake build PEL4.RecoveryEventualStability
          lake env lean PEL4/RecoveryEventualStabilityAxiomAudit.lean
      - name: Build and audit Gate 26 abstract finite epistemic descent
        run: |
          lake build PEL4.FiniteEpistemicDescent
          lake env lean PEL4/FiniteEpistemicDescentAxiomAudit.lean
      - name: Build and audit Gate 25 duplicate-free recovery coordinate budget
        run: |
          lake build PEL4.RecoveryCoordinateBudget
          lake env lean PEL4/RecoveryCoordinateBudgetAxiomAudit.lean
      - name: Audit Gate 21 finite recovery-observation maps
        run: lake env lean PEL4/FiniteReachableRecoveryAxiomAudit.lean
      - name: Audit Gate 20 finite local scope bounds
        run: lake env lean PEL4/FiniteUpdateScopeBoundsAxiomAudit.lean
      - name: Audit Gate 19 finite-update recovery
        run: lake env lean PEL4/FiniteUpdateRecoveryAxiomAudit.lean
      - name: Audit Gate 18 independent classical-calculus soundness
        run: lake env lean PEL4/ClassicalModalCalculusAxiomAudit.lean
      - name: Audit Gate 17 recovered classical consequence equivalence
        run: lake env lean PEL4/RecoveredClassicalConsequenceEquivalenceAxiomAudit.lean
      - name: Audit Gate 16 independent classical modal semantics
        run: lake env lean PEL4/IndependentClassicalModalSemanticsAxiomAudit.lean
      - name: Audit Gate 15 maximal recursive classical fragment
        run: lake env lean PEL4/MaximalClassicalLawFragmentAxiomAudit.lean
      - name: Audit Gate 14 recursive LEM-EFQ profile
        run: lake env lean PEL4/RecursiveClassicalLawProfileAxiomAudit.lean
      - name: Audit Gate 13 conditionalization-integrity assumptions
        run: lake env lean PEL4/ConditionalizationProbabilityIntegrityAxiomAudit.lean
      - name: Audit Gate 12 directional recovery assumptions
        run: lake env lean PEL4/DirectionalThresholdRecoveryAxiomAudit.lean
      - name: Audit Gate 11 dynamic recovery assumptions
        run: lake env lean PEL4/DynamicCompositionalRecoveryAxiomAudit.lean
      - name: Audit Gate 10 compositional recovery assumptions
        run: lake env lean PEL4/CompositionalClassicalRecoveryAxiomAudit.lean
      - name: Verify project axiom inventory
        run: python3 scripts/check_project_axioms.py
      - name: Audit finite-fine-grainedness theorem assumptions
        run: lake env lean PEL4/PopulationAxiology/AxiomAudit.lean
      - name: Audit modal-probabilistic refinement assumptions
        run: python3 scripts/check_mpfg_axioms.py
      - name: Test manuscript audit checker
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Audit manuscript theorem assumptions
        run: python3 scripts/check_paper_axioms.py --report paper-axioms.json
      - uses: actions/upload-artifact@v4
        with:
          name: paper-axiom-inventory
          path: paper-axioms.json

  paper:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install manuscript toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-latex-extra texlive-pictures lmodern poppler-utils
      - name: Render manuscript and check committed PDF
        run: python3 scripts/check_paper.py --check-committed
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: working-manuscript
          path: paper/main.pdf
