name: Gate 112 CI

on:
  push:
    branches:
      - research/cost-of-identifiability-gate112
  workflow_dispatch:

jobs:
  gate112:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
      - name: Build and audit Gate 112 cost of identifiability
        run: |
          lake build PEL4.CostOfIdentifiability
          lake env lean PEL4/CostOfIdentifiabilityAxiomAudit.lean
