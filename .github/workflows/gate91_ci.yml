name: Gate 91 CI

on:
  push:
    branches:
      - research/dual-value-information-gate91
  workflow_dispatch:

jobs:
  gate91:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
      - name: Build and audit Gate 91 dual value of information
        run: |
          lake build PEL4.DualValueOfInformation
          lake env lean PEL4/DualValueOfInformationAxiomAudit.lean
