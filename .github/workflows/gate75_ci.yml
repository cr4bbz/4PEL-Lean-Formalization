name: Gate 75 CI

on:
  push:
    branches:
      - research/discounted-bellman-fixed-point-gate75
  workflow_dispatch:

jobs:
  gate75:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
      - name: Build and audit Gate 75 discounted Bellman fixed point
        run: |
          lake build PEL4.DiscountedBellmanFixedPoint
          lake env lean PEL4/DiscountedBellmanFixedPointAxiomAudit.lean
