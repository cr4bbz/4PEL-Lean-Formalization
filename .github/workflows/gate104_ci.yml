name: Gate 104 CI

on:
  push:
    branches:
      - research/rational-epistemic-self-trust-gate104
  workflow_dispatch:

jobs:
  gate104:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
      - name: Build and audit Gate 104 rational epistemic self-trust
        run: |
          lake build PEL4.RationalEpistemicSelfTrust
          lake env lean PEL4/RationalEpistemicSelfTrustAxiomAudit.lean
