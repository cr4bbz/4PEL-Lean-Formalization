name: Gate 68 CI

on:
  push:
    branches:
      - research/adaptive-experiment-design-gate68
  workflow_dispatch:

jobs:
  gate68:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
      - name: Build and audit Gate 68 adaptive experiment design
        run: |
          lake build PEL4.AdaptiveExperimentDesign
          lake env lean PEL4/AdaptiveExperimentDesignAxiomAudit.lean
