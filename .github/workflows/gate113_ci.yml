name: Gate 113 CI

on:
  push:
    branches:
      - research/rational-unresolvedness-gate113
  workflow_dispatch:

jobs:
  gate113:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
      - name: Build and audit Gate 113 rational unresolvedness
        run: |
          lake build PEL4.RationalUnresolvedness
          lake env lean PEL4/RationalUnresolvednessAxiomAudit.lean
