name: Gate 100 CI

on:
  push:
    branches:
      - research/anomaly-driven-expansion-gate100
  workflow_dispatch:

jobs:
  gate100:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
      - name: Build and audit Gate 100 anomaly-driven model expansion
        run: |
          lake build PEL4.AnomalyDrivenModelExpansion
          lake env lean PEL4/AnomalyDrivenModelExpansionAxiomAudit.lean
