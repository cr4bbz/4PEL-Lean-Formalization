name: Gate 105 CI

on:
  push:
    branches:
      - research/nested-state-reachability-gate105
  workflow_dispatch:

jobs:
  gate105:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
      - name: Build and audit Gate 105 nested state reachability
        run: |
          lake build PEL4.NestedStateReachability
          lake env lean PEL4/NestedStateReachabilityAxiomAudit.lean
