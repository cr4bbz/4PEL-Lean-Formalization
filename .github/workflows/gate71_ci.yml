name: Gate 71 CI

on:
  push:
    branches:
      - research/stopping-region-geometry-gate71
  workflow_dispatch:

jobs:
  gate71:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
      - name: Build and audit Gate 71 stopping-region geometry
        run: |
          lake build PEL4.StoppingRegionGeometry
          lake env lean PEL4/StoppingRegionGeometryAxiomAudit.lean
