name: Gate 106 CI

on:
  push:
    branches:
      - research/cost-sensitive-self-trust-gate106
  workflow_dispatch:

jobs:
  gate106:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
      - name: Build and audit Gate 106 cost-sensitive self-trust
        run: |
          lake build PEL4.CostSensitiveSelfTrust
          lake env lean PEL4/CostSensitiveSelfTrustAxiomAudit.lean
