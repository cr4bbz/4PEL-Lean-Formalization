name: Gate 67 CI

on:
  push:
    branches:
      - research/alias-breaking-experiment-design-gate67
  workflow_dispatch:

jobs:
  gate67:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
      - name: Build and audit Gate 67 alias-breaking experiment design
        run: |
          lake build PEL4.AliasBreakingExperimentDesign
          lake env lean PEL4/AliasBreakingExperimentDesignAxiomAudit.lean
