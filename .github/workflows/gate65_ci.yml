name: Gate 65 CI

on:
  push:
    branches:
      - research/epistemic-identifiability-gate65
  workflow_dispatch:

jobs:
  gate65:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
      - name: Build and audit Gate 65 epistemic identifiability
        run: |
          lake build PEL4.EpistemicIdentifiability
          lake env lean PEL4/EpistemicIdentifiabilityAxiomAudit.lean
