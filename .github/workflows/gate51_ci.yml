name: Gate 51 CI

on:
  push:
    branches:
      - research/value-of-information-gate51
  pull_request:
  workflow_dispatch:

jobs:
  gate51:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
      - name: Build and audit Gate 51 value of information
        run: |
          lake build PEL4.ValueOfInformation
          lake env lean PEL4/ValueOfInformationAxiomAudit.lean
