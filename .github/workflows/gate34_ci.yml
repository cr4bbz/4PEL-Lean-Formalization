name: Gate 34 CI

on:
  push:
    branches:
      - research/regenerative-recovery-budgets-gate34
  workflow_dispatch:

jobs:
  gate34:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
      - name: Build and audit Gate 34 regenerative recovery budgets
        run: |
          lake build PEL4.RegenerativeRecoveryBudget
          lake env lean PEL4/RegenerativeRecoveryBudgetAxiomAudit.lean
