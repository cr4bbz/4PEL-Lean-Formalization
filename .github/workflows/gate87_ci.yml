name: Gate 87 CI

on:
  push:
    branches:
      - research/bayesian-model-update-gate87
  workflow_dispatch:

jobs:
  gate87:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
      - name: Build and audit Gate 87 Bayesian model update
        run: |
          lake build PEL4.BayesianModelUpdate
          lake env lean PEL4/BayesianModelUpdateAxiomAudit.lean
