name: Gate 63 CI

on:
  push:
    branches:
      - research/noisy-value-of-information-gate63
  workflow_dispatch:

jobs:
  gate63:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
      - name: Build and audit Gate 63 noisy value of information
        run: |
          lake build PEL4.NoisyValueOfInformation
          lake env lean PEL4/NoisyValueOfInformationAxiomAudit.lean
