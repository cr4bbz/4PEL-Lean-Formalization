name: Gate 79 CI

on:
  push:
    branches:
      - research/robust-maximin-gate79
  workflow_dispatch:

jobs:
  gate79:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
      - name: Build and audit Gate 79 robust maximin control
        run: |
          lake build PEL4.RobustMaximinControl
          lake env lean PEL4/RobustMaximinControlAxiomAudit.lean
