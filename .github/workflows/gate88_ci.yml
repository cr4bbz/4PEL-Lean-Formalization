name: Gate 88 CI

on:
  push:
    branches:
      - research/posterior-model-control-gate88
  workflow_dispatch:

jobs:
  gate88:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
      - name: Build and audit Gate 88 posterior model-dependent control
        run: |
          lake build PEL4.PosteriorModelDependentControl
          lake env lean PEL4/PosteriorModelDependentControlAxiomAudit.lean
