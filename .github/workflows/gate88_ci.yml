name: Gate 88 CI

on:
  push:
    branches:
      - research/meta-value-of-information-gate88
  workflow_dispatch:

jobs:
  gate88:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
      - name: Build and audit Gate 88 meta value of information
        run: |
          lake build PEL4.MetaValueOfInformation
          lake env lean PEL4/MetaValueOfInformationAxiomAudit.lean
