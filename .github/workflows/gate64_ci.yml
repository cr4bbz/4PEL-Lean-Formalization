name: Gate 64 CI

on:
  push:
    branches:
      - research/active-epistemic-sensing-gate64
  workflow_dispatch:

jobs:
  gate64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
      - name: Build and audit Gate 64 active epistemic sensing
        run: |
          lake build PEL4.ActiveEpistemicSensing
          lake env lean PEL4/ActiveEpistemicSensingAxiomAudit.lean
