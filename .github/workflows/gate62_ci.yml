name: Gate 62 CI

on:
  push:
    branches:
      - research/belief-state-bellman-gate62
  workflow_dispatch:

jobs:
  gate62:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
      - name: Build and audit Gate 62 belief-state Bellman control
        run: |
          lake build PEL4.BeliefStateBellmanControl
          lake env lean PEL4/BeliefStateBellmanControlAxiomAudit.lean
