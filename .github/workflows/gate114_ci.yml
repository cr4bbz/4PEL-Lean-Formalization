name: Gate 114 CI

on:
  push:
    branches:
      - research/general-identifiability-gate114
  workflow_dispatch:

jobs:
  gate114:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
      - name: Build and audit Gate 114 general identifiability
        run: |
          lake build PEL4.GeneralIdentifiability
          lake env lean PEL4/GeneralIdentifiabilityAxiomAudit.lean
