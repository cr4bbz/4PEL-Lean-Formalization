name: Gate 116 CI

on:
  push:
    branches:
      - research/noisy-identification-gate116
  workflow_dispatch:

jobs:
  gate116:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
      - name: Build and audit Gate 116 noisy identification
        run: |
          lake build PEL4.NoisyIdentification
          lake env lean PEL4/NoisyIdentificationAxiomAudit.lean
