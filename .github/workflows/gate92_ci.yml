name: Gate 92 CI

on:
  push:
    branches:
      - research/calibrated-world-inference-gate92
  workflow_dispatch:

jobs:
  gate92:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
      - name: Build and audit Gate 92 calibrated world inference
        run: |
          lake build PEL4.CalibratedWorldInference
          lake env lean PEL4/CalibratedWorldInferenceAxiomAudit.lean
