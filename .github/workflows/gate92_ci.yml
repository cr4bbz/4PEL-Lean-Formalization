name: Gate 92 CI

on:
  push:
    branches:
      - research/active-calibration-gate92
  workflow_dispatch:

jobs:
  gate92:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
      - name: Build and audit Gate 92 active calibration
        run: |
          lake build PEL4.ActiveCalibration
          lake env lean PEL4/ActiveCalibrationAxiomAudit.lean
