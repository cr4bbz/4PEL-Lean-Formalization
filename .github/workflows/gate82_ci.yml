name: Gate 82 CI

on:
  push:
    branches:
      - research/missing-evidence-abstention-gate82
  workflow_dispatch:

jobs:
  gate82:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
      - name: Build and audit Gate 82 missing evidence abstention
        run: |
          lake build PEL4.MissingEvidenceAbstention
          lake env lean PEL4/MissingEvidenceAbstentionAxiomAudit.lean
