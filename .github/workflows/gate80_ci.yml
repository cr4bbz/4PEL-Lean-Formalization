name: Gate 80 CI

on:
  push:
    branches:
      - research/calibration-witness-gate80
  workflow_dispatch:

jobs:
  gate80:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
      - name: Build and audit Gate 80 calibration status witness
        run: |
          lake build PEL4.CalibrationStatusWitness
          lake env lean PEL4/CalibrationStatusWitnessAxiomAudit.lean
