name: Gate 108 CI

on:
  push:
    branches:
      - research/epistemic-repair-dynamics-gate108
  workflow_dispatch:

jobs:
  gate108:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
      - name: Build and audit Gate 108 epistemic repair dynamics
        run: |
          lake build PEL4.EpistemicRepairDynamics
          lake env lean PEL4/EpistemicRepairDynamicsAxiomAudit.lean
