name: Gate 83 CI

on:
  push:
    branches:
      - research/adversarial-robustness-gate83
  workflow_dispatch:

jobs:
  gate83:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
      - name: Build and audit Gate 83 adversarial sensor robustness
        run: |
          lake build PEL4.AdversarialSensorRobustness
          lake env lean PEL4/AdversarialSensorRobustnessAxiomAudit.lean
